<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .bg { fill: #1a1a1a; }
    .hole { fill: #f5f5f5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f5f5f5; }
      .hole { fill: #1a1a1a; }
    }
  </style>

  <!-- 필름 외곽 -->
  <rect class="bg" x="4" y="14" width="120" height="100" rx="6"/>

  <!-- 상단 펀치홀 (5개) -->
  <rect class="hole" x="8"   y="20" width="15" height="16" rx="3"/>
  <rect class="hole" x="31"  y="20" width="15" height="16" rx="3"/>
  <rect class="hole" x="57"  y="20" width="15" height="16" rx="3"/>
  <rect class="hole" x="83"  y="20" width="15" height="16" rx="3"/>
  <rect class="hole" x="108" y="20" width="15" height="16" rx="3"/>

  <!-- 하단 펀치홀 (5개) -->
  <rect class="hole" x="8"   y="92" width="15" height="16" rx="3"/>
  <rect class="hole" x="31"  y="92" width="15" height="16" rx="3"/>
  <rect class="hole" x="57"  y="92" width="15" height="16" rx="3"/>
  <rect class="hole" x="83"  y="92" width="15" height="16" rx="3"/>
  <rect class="hole" x="108" y="92" width="15" height="16" rx="3"/>
</svg>
